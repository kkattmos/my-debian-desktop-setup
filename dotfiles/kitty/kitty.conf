# kitty: the terminal for Jupyter notebooks in Neovim (`nb x.ipynb`, or open a .ipynb from Files).
# Ptyxis stays the everyday terminal; kitty is used because it can draw plots inline (kitty graphics
# protocol). Same look as the Ptyxis "Gooey" profile; Blur my Shell blurs behind it (app id "kitty").

font_family        JetBrainsMono Nerd Font
font_size          12
background_opacity 0.70
window_padding_width 6
wayland_titlebar_color background
confirm_os_window_close 0
enable_audio_bell no
remember_window_size no
initial_window_width  110c
initial_window_height 32c

# Gooey palette (same 16 colours as dotfiles/nvim/lua/plugins/colorscheme.lua)
foreground           #EBEEF9
background           #0D101B
cursor               #EBEEF9
selection_background #34466B
selection_foreground none
url_color            #97BBF7
color0  #000009
color1  #BB4F6C
color2  #72CCAE
color3  #C65E3D
color4  #58B6CA
color5  #6488C4
color6  #8D84C6
color7  #858893
color8  #1F222D
color9  #EE829F
color10 #A5FFE1
color11 #F99170
color12 #8BE9FD
color13 #97BBF7
color14 #C0B7F9
color15 #FFFFFF
