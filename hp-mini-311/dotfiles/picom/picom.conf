# picom 9.1 (Debian 12): the Gooey blur on the HP Mini 311. Installed by m37-xfce-look.sh to
# ~/.config/picom/picom.conf and started by ~/.config/autostart/picom.desktop as
#   picom --experimental-backends
# (dual_kawase blur only exists in the experimental backends of picom 9). Toggle: svc blur on|off
# xfwm4's own compositor must be off while picom runs (m37 / svc blur do that).

backend = "glx";
vsync = true;
use-damage = true;

# no shadows, fades or rounded corners: the Atom + ION has little to spare
shadow = false;
fading = false;
corner-radius = 0;

# Blur behind see-through windows, like Blur my Shell on the Dell. picom 9 can't list the windows
# to blur, only the ones NOT to blur, hence the "!( ... )": everything except the terminal, the
# panels (window type dock) and Firefox stays sharp. Check a window's class with: xprop WM_CLASS
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;
blur-background-exclude = [
  "!(class_g = 'Xfce4-terminal' || window_type = 'dock' || class_g = 'firefox-esr')"
];
